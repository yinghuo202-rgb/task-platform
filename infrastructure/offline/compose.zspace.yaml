# 旧离线部署兼容文件。新部署请优先使用仓库根目录 compose.yaml + .env.zspace.example。
# 本文件不再保存任何密码；Compose 会从同目录或 --env-file 指定的 .env 读取。
services:
  reverse-proxy:
    image: "${PROXY_IMAGE}"
    platform: "${APP_PLATFORM:-linux/amd64}"
    pull_policy: "${IMAGE_PULL_POLICY:-always}"
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8081}:8080"
    depends_on:
      - web
      - api
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/proxy-health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: "${WEB_IMAGE}"
    platform: "${APP_PLATFORM:-linux/amd64}"
    pull_policy: "${IMAGE_PULL_POLICY:-always}"
    restart: unless-stopped
    environment:
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  api-storage-init:
    # Prepare NAS upload permissions before the non-root API starts.
    image: "${API_IMAGE}"
    platform: "${APP_PLATFORM:-linux/amd64}"
    pull_policy: "${IMAGE_PULL_POLICY:-always}"
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: "mkdir -p /data/uploads/journal && (chown -R 10001:10001 /data/uploads || chmod -R a+rwX /data/uploads)"
    volumes:
      - "${UPLOAD_DATA_PATH}:/data/uploads"

  api:
    image: "${API_IMAGE}"
    platform: "${APP_PLATFORM:-linux/amd64}"
    pull_policy: "${IMAGE_PULL_POLICY:-always}"
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: "3001"
      DATABASE_URL: "${DATABASE_URL}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      REGISTRATION_INVITE_CODE: "${REGISTRATION_INVITE_CODE:-}"
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 180d
      PUBLIC_APP_URL: "${PUBLIC_APP_URL}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: ""
      TRUST_PROXY: "1"
      UPLOAD_DIR: /data/uploads
      JOURNAL_IMPORT_DIR: /data/journal-import
      MAX_UPLOAD_SIZE_MB: "20"
      MAX_FILES_PER_REQUEST: "10"
    expose:
      - "3001"
    volumes:
      - "${UPLOAD_DATA_PATH}:/data/uploads"
      - "${JOURNAL_IMPORT_PATH}:/data/journal-import:ro"
    depends_on:
      - db
      - api-storage-init
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: "${POSTGRES_IMAGE:-postgres:17.5-bookworm}"
    platform: "${APP_PLATFORM:-linux/amd64}"
    pull_policy: "${IMAGE_PULL_POLICY:-always}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_platform
      POSTGRES_USER: task_platform
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
      PGTZ: UTC
    volumes:
      - "${POSTGRES_DATA_PATH}:/var/lib/postgresql/data"
      - "${BACKUP_DATA_PATH}:/data/backups"
    networks:
      - backend
    shm_size: 256mb
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_platform -d task_platform"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

networks:
  frontend:
  backend:
    internal: true
