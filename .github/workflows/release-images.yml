name: Release Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: task_platform_test
          POSTGRES_USER: task_platform
          POSTGRES_PASSWORD: integration_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_platform -d task_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate NAS maintenance scripts
        run: >-
          sh -n
          infrastructure/scripts/backup.sh
          infrastructure/scripts/prune-app-images.sh
          infrastructure/scripts/restore.sh
          infrastructure/scripts/update.sh
          infrastructure/maintenance/entrypoint.sh
          infrastructure/maintenance/update.sh
      - name: Prepare integration database
        env:
          DATABASE_URL: postgresql://task_platform:integration_test_only@127.0.0.1:5432/task_platform_test
        run: pnpm --filter @task-platform/api db:migrate
      - name: Run database integration tests
        env:
          TEST_DATABASE_URL: postgresql://task_platform:integration_test_only@127.0.0.1:5432/task_platform_test
        run: pnpm --filter @task-platform/api test:integration

  publish:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proxy
            context: infrastructure/nginx
            file: infrastructure/nginx/Dockerfile
          - name: web
            context: .
            file: apps/web/Dockerfile
          - name: api
            context: .
            file: apps/api/Dockerfile
          - name: maintenance
            context: .
            file: infrastructure/maintenance/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release-kit:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package NAS online-update files
        shell: bash
        run: |
          archive="task-platform-nas-update-kit-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$archive" \
            compose.yaml \
            .env.zspace.example \
            infrastructure/maintenance/Dockerfile \
            infrastructure/maintenance/entrypoint.sh \
            infrastructure/maintenance/update.sh \
            infrastructure/scripts/backup.sh \
            infrastructure/scripts/prune-app-images.sh \
            infrastructure/scripts/restore.sh \
            infrastructure/scripts/update.sh
      - name: Publish update kit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="task-platform-nas-update-kit-${GITHUB_REF_NAME}.tar.gz"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
