packages:
  - apps/*
  - packages/*

allowBuilds:
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-ia32": true
  "@embedded-postgres/linux-ppc64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  "@prisma/engines": true
  "@scarf/scarf": false
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - postcss@8.5.10 || 8.5.12 || 8.5.18 || 8.5.23
  - sharp@0.35.0
  - find-my-way@9.6.1
  - js-yaml@4.3.1 || 5.2.2
  - valibot@1.4.2
  - brace-expansion@1.1.17 || 1.1.18 || 5.0.9
  - fast-uri@3.1.5
  - nanoid@3.3.17

onlyBuiltDependencies:
  - argon2
  - "@prisma/client"
  - "@prisma/engines"
  - prisma

overrides:
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  find-my-way@<=9.6.0: ^9.6.1
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  js-yaml@>=5.0.0 <=5.2.1: ^5.2.2
  nanoid@<3.3.17: ^3.3.17
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  sharp@<0.35.0: ^0.35.0
  valibot@<=1.4.1: ^1.4.2
